name: Uptaco domain and first-party UI contracts
on:
  pull_request:
  push:
    branches:
      - feat/spatial-solito-site-foundation
      - feat/first-party-cart-motion
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0','24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Semantic feature UI guard
        run: node tooling/check-semantic-ui.mjs
      - name: First-party routes guard
        run: node tooling/check-first-party-routes.mjs
      - name: Navigation / checkout gates / bag domain contracts
        run: >
          node --experimental-strip-types --test
          packages/app/navigation/contracts.test.mjs
          packages/commerce/test/order.test.mjs
          packages/commerce/test/bag.test.mjs
          packages/experience/test/capabilities.test.mjs

  payload-schema:
    name: Payload v4 schema types
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.8.1'
      - name: Install exact Payload beta dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck CMS collection definitions
        run: pnpm --filter @uptaco/payload typecheck
