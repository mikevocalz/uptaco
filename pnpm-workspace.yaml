packages:
  - 'apps/*'
  - 'packages/*'

# Expo 58 / React Native 0.88 is a coupled native compatibility lane.
# Payload 4 beta packages must share the exact version.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  lightningcss: 1.30.1

allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  'kinetrell@https://codeload.github.com/mikevocalz/Kinetrell/tar.gz/344de51531ce050c4311d3feb70e4d596bdc8041': true

catalog:
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-web: 0.21.4
  expo: 58.0.19
  '@expo/html-elements': 58.0.3
  '@expo/ui': 58.0.23
  expo-image: 58.0.17
  next: 16.4.3
  eslint-config-next: 16.4.3
  solito: 5.0.0
  uniwind: 1.12.0
  react-native-css: 3.0.7
  zustand: 5.0.15
  gsap: 3.15.0
  '@gsap/react': 2.1.2
  lenis: 1.3.27
  react-native-reanimated: 4.7.1
  react-native-worklets: 0.13.1
  react-native-gesture-handler: 3.4.0
  kinetrell: https://codeload.github.com/mikevocalz/Kinetrell/tar.gz/344de51531ce050c4311d3feb70e4d596bdc8041
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  lightningcss: 1.30.1
  payload: 4.0.0-beta.6
  '@payloadcms/db-postgres': 4.0.0-beta.6
  '@payloadcms/next': 4.0.0-beta.6
  '@payloadcms/ui': 4.0.0-beta.6
  typescript: 6.0.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': 26.6.3
  turbo: 2.11.5

  lucide-react: 1.58.0
  lucide-react-native: 1.58.0
